name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      # trains the whole pipeline on synthetic data and gates on leakage, parity and quality checks
      - run: pytest -q
      # report.json đã commit (train trên dữ liệu thật) phải qua regression gate so với eval/baseline.json
      - run: python -m ci.gate
